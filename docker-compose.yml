services:
    db:
        image: postgres:17
        environment:
            POSTGRES_USER: card
            POSTGRES_PASSWORD: card
            POSTGRES_DB: card
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - "5436:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U card -d card" ]
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    pgdata:
